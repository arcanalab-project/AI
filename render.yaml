services:
  - type: web
    name: tin-app
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npx next start --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: MONGODB_DB
        value: TIN
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
