apiVersion: v1
kind: Namespace
metadata:
  name: nato-catalog
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: nato-catalog
  labels:
    app: mongo
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: mongo
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: nato-catalog
  labels:
    app: mongo
spec:
  serviceName: mongo
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: mongo
          image: mongo:7.0
          args:
            - --replSet
            - rs0
            - --bind_ip_all
          ports:
            - name: mongo
              containerPort: 27017
          readinessProbe:
            tcpSocket:
              port: mongo
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-replica-init
  namespace: nato-catalog
spec:
  backoffLimit: 30
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: mongo:7.0
          command: ["bash", "-c"]
          args:
            - |
              set -eu
              for host in mongo-0.mongo mongo-1.mongo mongo-2.mongo; do
                until mongosh --quiet --host "$host" --eval 'db.adminCommand({ ping: 1 })'; do
                  sleep 2
                done
              done
              mongosh --quiet --host mongo-0.mongo --eval '
                try {
                  if (rs.status().ok) quit(0);
                } catch (e) {}
                const result = rs.initiate({
                  _id: "rs0",
                  members: [
                    { _id: 0, host: "mongo-0.mongo:27017" },
                    { _id: 1, host: "mongo-1.mongo:27017" },
                    { _id: 2, host: "mongo-2.mongo:27017" }
                  ]
                });
                if (!result.ok) quit(1);
              '
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nato-catalog
  namespace: nato-catalog
  labels:
    app: nato-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nato-catalog
  template:
    metadata:
      labels:
        app: nato-catalog
    spec:
      initContainers:
        - name: wait-for-mongo
          image: mongo:7.0
          command: ["bash", "-c"]
          args:
            - |
              until mongosh --quiet "mongodb://mongo-0.mongo:27017,mongo-1.mongo:27017,mongo-2.mongo:27017/nato_catalog?replicaSet=rs0" --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; do
                sleep 2
              done
      containers:
        - name: catalog
          image: nato-catalog:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: BIND_HOST
              value: "0.0.0.0"
            - name: MONGODB_URI
              value: mongodb://mongo-0.mongo:27017,mongo-1.mongo:27017,mongo-2.mongo:27017/nato_catalog?replicaSet=rs0
            - name: MONGODB_DB
              value: nato_catalog
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nato-catalog
  namespace: nato-catalog
  labels:
    app: nato-catalog
spec:
  selector:
    app: nato-catalog
  ports:
    - name: http
      port: 3000
      targetPort: http
