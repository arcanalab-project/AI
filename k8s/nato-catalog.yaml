apiVersion: v1
kind: Namespace
metadata:
  name: nato-catalog
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: nato-catalog
  labels:
    app: mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7.0
          ports:
            - name: mongo
              containerPort: 27017
          readinessProbe:
            tcpSocket:
              port: mongo
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: nato-catalog
  labels:
    app: mongo
spec:
  selector:
    app: mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: mongo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nato-catalog
  namespace: nato-catalog
  labels:
    app: nato-catalog
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nato-catalog
  template:
    metadata:
      labels:
        app: nato-catalog
    spec:
      containers:
        - name: catalog
          image: nato-catalog:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: BIND_HOST
              value: "0.0.0.0"
            - name: MONGODB_URI
              value: mongodb://mongo:27017/nato_catalog
            - name: MONGODB_DB
              value: nato_catalog
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nato-catalog
  namespace: nato-catalog
  labels:
    app: nato-catalog
spec:
  selector:
    app: nato-catalog
  ports:
    - name: http
      port: 3000
      targetPort: http
